name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  # "write" lets the workflow publish the APK as a release, so it can be downloaded directly
  # as an .apk file (artifacts always come wrapped in a .zip).
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch DeSmuME and mGBA sources (pinned commits)
        run: |
          ./scripts/fetch_desmume.sh
          ./scripts/fetch_mgba.sh

      - name: Fetch cheat databases (libretro-database, pinned commit)
        run: |
          ./scripts/fetch_cheats.sh
          ./scripts/fetch_cheats_gb.sh

      - name: Validate shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          for core in desmume mgba; do
            out=/tmp/shaders-$core
            mkdir -p $out
            if [ $core = desmume ]; then tool=tools/DumpShaders.java; else tool=tools/mgba/DumpShaders.java; fi
            javac -d $out app/src/main/java/org/$core/android/Shaders.java $tool
            java -cp $out org.$core.android.DumpShaders $out/glsl
            for f in $out/glsl/*; do glslangValidator "$f"; done
          done

      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Check APK (signature, alignment, manifest)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          f=app/build/outputs/apk/release/app-release.apk
          ls -la "$f"
          unzip -l "$f" | grep -E "\.so$"
          "$BT"/apksigner verify --verbose "$f" | head -4
          "$BT"/zipalign -c -P 16 4 "$f" && echo "Alignment OK"
          "$BT"/aapt2 dump badging "$f" | grep -E "^package|^minSdk|^targetSdk|^native-code|launchable"
          mkdir -p out
          cp "$f" out/ds-gba-emulador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ds-gba-apk
          path: out/ds-gba-emulador.apk
          if-no-files-found: error

      - name: Publish as the "latest" release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/ds-gba-emulador.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Último build ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "APK de teste gerado automaticamente. Baixe ds-gba-emulador.apk direto no celular e toque para instalar."
