name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch DeSmuME source (pinned commit)
        run: ./scripts/fetch_desmume.sh

      - name: Fetch cheat database (libretro-database, pinned commit)
        run: ./scripts/fetch_cheats.sh

      - name: Validate shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          mkdir -p /tmp/shaders
          javac -d /tmp/shaders app/src/main/java/org/desmume/android/Shaders.java tools/DumpShaders.java
          java -cp /tmp/shaders org.desmume.android.DumpShaders /tmp/shaders/out
          for f in /tmp/shaders/out/*; do glslangValidator "$f"; done

      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: desmume-android-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
