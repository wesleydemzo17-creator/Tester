# Compila o PokeBank automaticamente a cada push:
#   - pokebank.nds  (devkitPro oficial, imagem devkitpro/devkitarm)
#   - app-debug.apk (Android SDK do proprio runner do GitHub)
# Os arquivos ficam em Actions > (execucao) > Artifacts.
# Ao criar uma tag v* (ex.: v1.0), tambem publica uma Release com os dois arquivos.
name: PokeBank

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Garantir bibliotecas do DS (libnds, calico, dswifi)
        run: dkp-pacman -Sy --noconfirm --needed nds-dev || true
      - name: Compilar
        run: make -C ds
      - uses: actions/upload-artifact@v4
        with:
          name: pokebank-nds
          path: ds/pokebank.nds

  simulador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o simulador do DS (mesma logica, no PC)
        run: make -C ds/host CFLAGS="-O2 -Wall -Wextra -Werror -std=gnu11"

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes do nucleo e APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pokebank-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Guarda os arquivos compilados na branch "pokebank-builds" (facil de baixar e de achar).
  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/pokebank'
    needs: [nds, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Enviar para a branch pokebank-builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cd pub
          cp ../out/pokebank-nds/pokebank.nds ../out/pokebank-apk/app-debug.apk .
          mv app-debug.apk pokebank.apk
          printf 'Compilado de %s em %s\n' "${{ github.sha }}" "$(date -u)" > BUILD.txt
          git init -q -b pokebank-builds
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -q -m "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" pokebank-builds

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nds, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/pokebank-nds/pokebank.nds
            out/pokebank-apk/app-debug.apk
