plugins {
    id 'com.android.application'
}

android {
    namespace 'org.desmume.android'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.desmume.android.port'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-test'

        ndk {
            // 64-bit ARM only: that is where the ARM JIT and the NEON paths live.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          "-DDESMUME_SRC=${rootDir}/desmume-upstream/desmume/src"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            // Optimised build signed with the debug key, so the APK installs directly for testing.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
